<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpinePlan Pro V14 - Definitivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
        .scrollable-panel::-webkit-scrollbar { width: 6px; }
        .scrollable-panel::-webkit-scrollbar-track { background: #1e293b; }
        .scrollable-panel::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .tool-btn.active { background-color: #10b981; color: white; border-color: #059669; }
        #canvas-container { cursor: crosshair; background-image: radial-gradient(#334155 1px, transparent 1px); background-size: 20px 20px; }
        
        #context-menu { display: none; position: fixed; z-index: 50; background: #1e293b; border: 1px solid #334155; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); width: 220px; padding: 12px; }
        .menu-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; display: block; }
        .menu-input { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; padding: 4px 8px; font-size: 13px; margin-bottom: 10px; }
        .menu-slider { width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- BARRA SUPERIOR -->
    <header class="bg-gray-900 border-b border-gray-800 p-3 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center space-x-3 text-emerald-400 font-bold text-xl">
            <img src="nuevo_logo.jpeg" alt="Logo" class="w-8 h-8 object-cover rounded">
            <span>SpinePlan <span class="text-white text-sm font-normal">Pro</span></span>
        </div>
        
        <div class="flex items-center space-x-3">
            <!-- BOTÓN DE ORIENTACIÓN (MIRADA) -->
            <button onclick="toggleGaze()" id="gaze-btn" class="bg-gray-800 hover:bg-gray-700 text-emerald-400 border border-emerald-600/50 px-3 py-1.5 rounded text-xs font-semibold transition-colors flex items-center shadow-sm">
                Mirada: ➡️
            </button>
            
            <label class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded text-sm font-medium cursor-pointer flex items-center transition-colors">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Cargar Radiografía
                <input type="file" id="imageLoader" class="hidden" accept="image/*">
            </label>
            <button onclick="clearCanvas()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-1.5 rounded text-sm font-medium transition-colors border border-gray-600">Limpiar Todo</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <!-- PANEL IZQUIERDO -->
        <aside class="w-80 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0 relative z-20">
            <div class="p-3 bg-gray-800 border-b border-gray-700">
                <p id="status-bar" class="text-xs font-semibold text-emerald-400 flex items-center">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span> Sistema Listo
                </p>
            </div>
            
            <div class="flex-1 overflow-y-auto scrollable-panel p-3 space-y-3 pb-24">
                
                <div class="border border-gray-700 rounded-lg overflow-hidden">
                    <div class="bg-gray-800 px-3 py-2 text-sm font-semibold text-white">1. Herramientas Básicas</div>
                    <div class="p-3 grid grid-cols-2 gap-2 bg-gray-900/50">
                        <button onclick="activateTool('line', 'Línea Simple')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">Línea Simple</button>
                        <button onclick="activateTool('circle', 'Círculo')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">Círculo</button>
                        <button onclick="activateTool('cobb', 'A. Cobb')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">Ángulo Cobb</button>
                        <button onclick="activateTool('cobb', 'Tk')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">Tk (Cifosis)</button>
                    </div>
                </div>

                <div class="border border-gray-700 rounded-lg overflow-hidden">
                    <div class="bg-gray-800 px-3 py-2 text-sm font-semibold text-white">2. Parámetros Pélvicos</div>
                    <div class="p-3 bg-gray-900/50">
                        <button onclick="activateTool('pelvic', 'Parámetros Pélvicos')" class="tool-btn w-full border border-gray-700 rounded px-2 py-2 text-xs text-gray-300 hover:bg-gray-800 flex justify-center items-center">
                            Medir PI, PT y SS
                        </button>
                    </div>
                </div>

                <div class="border border-gray-700 rounded-lg overflow-hidden">
                    <div class="bg-gray-800 px-3 py-2 text-sm font-semibold text-white">3. Balance Sagital</div>
                    <div class="p-3 grid grid-cols-2 gap-2 bg-gray-900/50">
                        <button onclick="activateTool('sagittal', 'L1-PA', 'pa')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">L1-PA</button>
                        <button onclick="activateTool('sagittal', 'T4-PA', 'pa')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">T4-PA</button>
                        <button onclick="activateTool('sagittal', 'C2-PA', 'pa')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">C2-PA</button>
                        <button onclick="activateTool('sagittal', 'L1 Tilt', 'tilt')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">L1 Tilt</button>
                        <button onclick="activateTool('sagittal', 'T4 Tilt', 'tilt')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">T4 Tilt</button>
                        <button onclick="activateTool('sagittal', 'C2 Tilt', 'tilt')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">C2 Tilt</button>
                    </div>
                </div>

                <div class="border border-gray-700 rounded-lg overflow-hidden">
                    <div class="bg-gray-800 px-3 py-2 text-sm font-semibold text-white">4. Mediciones Lumbares</div>
                    <div class="p-3 grid grid-cols-1 gap-2 bg-gray-900/50">
                        <button onclick="activateTool('cobb', 'L1-S1')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800 text-left">Lordosis Global (L1-S1)</button>
                        <button onclick="activateTool('cobb', 'L4-S1')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800 text-left">LL Baja (L4-S1)</button>
                        <button onclick="activateTool('cobb', 'L4-L5')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800 text-left">Segmentaria (L4-L5)</button>
                    </div>
                </div>

                <div class="border border-gray-700 rounded-lg overflow-hidden">
                    <div class="bg-gray-800 px-3 py-2 text-sm font-semibold text-emerald-400">5. Perfil Teórico Ideal</div>
                    <div class="p-3 bg-gray-900/50">
                        <button onclick="showTheoreticalProfile()" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-semibold rounded py-2 text-xs transition-colors border border-emerald-500 shadow-md">Calcular Valores</button>
                    </div>
                </div>

                <div class="border border-gray-700 rounded-lg overflow-hidden">
                    <div class="bg-gray-800 px-3 py-2 text-sm font-semibold text-white">6. Alineación Cervical</div>
                    <div class="p-3 grid grid-cols-2 gap-2 bg-gray-900/50">
                        <button onclick="activateTool('cobb', 'C2-C7 (LC)')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">C2-C7 (LC)</button>
                        <button onclick="activateTool('cobb', 'T1S')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">T1S</button>
                        <button onclick="activateTool('line', 'SVA C2-C7')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">SVA</button>
                        <button onclick="activateTool('cobb', 'CBVA')" class="tool-btn border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 hover:bg-gray-800">CBVA</button>
                    </div>
                </div>
                
            </div>
        </aside>

        <!-- ZONA PRINCIPAL DE DIBUJO -->
        <main class="flex-1 relative bg-black flex items-center justify-center overflow-hidden" id="canvas-container">
            <span id="placeholder-text" class="absolute text-gray-600 font-medium text-lg pointer-events-none">Selecciona "Cargar Radiografía" para comenzar</span>
            <canvas id="mainCanvas" class="absolute z-10"></canvas>
            
            <!-- TABLA DEL PERFIL TEÓRICO -->
            <div id="theoretical-table" class="hidden absolute top-12 left-4 bg-gray-900/95 border border-emerald-500 rounded-lg p-4 shadow-2xl z-40 backdrop-blur-md min-w-[300px]">
                <div class="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
                    <h3 class="text-emerald-400 font-bold text-sm">Perfil Teórico Ideal</h3>
                    <button onclick="document.getElementById('theoretical-table').classList.add('hidden')" class="text-gray-400 hover:text-white bg-gray-800 rounded px-2 py-0.5 text-xs">&times; Cerrar</button>
                </div>
                <table class="text-xs text-left w-full text-gray-200">
                    <thead>
                        <tr class="text-gray-400 border-b border-gray-700">
                            <th class="pb-2 pr-3 font-semibold">Parámetro</th>
                            <th class="pb-2 pr-3 font-semibold">Base</th>
                            <th class="pb-2 font-semibold text-emerald-400">Ideal</th>
                        </tr>
                    </thead>
                    <tbody id="theo-tbody">
                        <!-- Llenado dinámico por JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- MENÚ CONTEXTUAL (CLIC DERECHO) -->
            <div id="context-menu">
                <label class="menu-label">Título de la medición</label>
                <input type="text" id="ctx-title" class="menu-input">
                
                <label class="menu-label">Grosor de línea (<span id="ctx-width-val">1</span>px)</label>
                <input type="range" id="ctx-width" class="menu-slider" min="1" max="5" value="1">
                
                <label class="menu-label">Tamaño de letra (<span id="ctx-size-val">11</span>px)</label>
                <input type="range" id="ctx-size" class="menu-slider" min="10" max="30" value="11">
                
                <label class="menu-label">Color</label>
                <input type="color" id="ctx-color" class="w-full h-8 mb-3 rounded bg-transparent border-none cursor-pointer">
                
                <button id="ctx-delete" class="w-full bg-red-600 hover:bg-red-700 text-white py-1.5 rounded text-xs font-semibold">Eliminar Medición</button>
            </div>
        </main>
    </div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const placeholder = document.getElementById('placeholder-text');
    const statusBar = document.getElementById('status-bar');
    const contextMenu = document.getElementById('context-menu');
    
    let bgImage = null;
    let imgX = 0, imgY = 0, imgScale = 1;
    
    const DEFAULT_LINE_WIDTH = 1; 
    const DEFAULT_FONT_SIZE = 11;
    const COLORS = ['#10b981', '#06b6d4', '#d946ef', '#f59e0b', '#f43f5e', '#3b82f6'];
    let colorIndex = 0;

    let measurements = [];
    let currentMeasurement = null;
    let activeTool = null;
    let activeTitle = '';
    let activeSubType = null;
    let pelvicStep = 0;
    let dragObj = null;

    let gazeDirection = 1;
    function toggleGaze() {
        gazeDirection *= -1;
        document.getElementById('gaze-btn').innerText = gazeDirection === 1 ? "Mirada: ➡️" : "Mirada: ⬅️";
        draw();
    }

    window.currentResults = {};
    
    function getNextColor() {
        let c = COLORS[colorIndex];
        colorIndex = (colorIndex + 1) % COLORS.length;
        return c;
    }

    document.getElementById('imageLoader').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            bgImage = new Image();
            bgImage.onload = function() {
                placeholder.style.display = 'none';
                resizeCanvas();
            }
            bgImage.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    });

    window.addEventListener('resize', resizeCanvas);
    function resizeCanvas() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        if (bgImage) {
            const scaleX = canvas.width / bgImage.width;
            const scaleY = canvas.height / bgImage.height;
            imgScale = Math.min(scaleX, scaleY) * 0.95;
            imgX = (canvas.width - bgImage.width * imgScale) / 2;
            imgY = (canvas.height - bgImage.height * imgScale) / 2;
        }
        draw();
    }

    function clearCanvas() {
        measurements = [];
        currentMeasurement = null;
        colorIndex = 0;
        bgImage = null;
        window.currentResults = {};
        document.getElementById('theoretical-table').classList.add('hidden');
        placeholder.style.display = 'block';
        ctx.clearRect(0,0, canvas.width, canvas.height);
        updateStatus("Sistema Listo");
    }

    function activateTool(type, title, subType = null) {
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');
        activeTool = type;
        activeTitle = title;
        activeSubType = subType;
        currentMeasurement = null;
        
        if(type === 'pelvic') {
            pelvicStep = 1;
            updateStatus(`Traza la Primera Cabeza Femoral (Clic y Arrastrar)`);
        } else if (type === 'sagittal') {
            updateStatus(`Haz un solo clic sobre la vértebra ${title}`);
        } else {
            updateStatus(`Herramienta activa: ${title}. Haz clic y arrastra.`);
        }
    }

    function deactivateTool() {
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        activeTool = null;
        activeSubType = null;
        currentMeasurement = null;
        pelvicStep = 0;
        updateStatus("Sistema Listo.");
    }

    function updateStatus(text, isError = false) {
        let colorClass = isError ? 'bg-red-500' : 'bg-emerald-500';
        let textClass = isError ? 'text-red-400' : 'text-emerald-400';
        statusBar.className = `text-xs font-semibold flex items-center ${textClass}`;
        statusBar.innerHTML = `<span class="w-2 h-2 rounded-full ${colorClass} mr-2 ${!isError ? 'animate-pulse' : ''}"></span> ${text}`;
    }

    function showTheoreticalProfile() {
        if (!window.currentResults['PI']) {
            updateStatus("⚠️ Debes medir los Parámetros Pélvicos (PI) primero.", true);
            document.getElementById('theoretical-table').classList.add('hidden');
            return;
        }

        let pi = window.currentResults['PI'];
        let ideal_L1S1 = (pi * 0.6) + 30;
        let ideal_PA = (pi * 0.5) - 20;

        let base_PI = window.currentResults['PI'] ? window.currentResults['PI'].toFixed(1) + '°' : '-';
        let base_L1S1 = window.currentResults['L1-S1'] ? window.currentResults['L1-S1'].toFixed(1) + '°' : '-';
        let base_L4S1 = window.currentResults['L4-S1'] ? window.currentResults['L4-S1'].toFixed(1) + '°' : '-';
        let base_L1PA = window.currentResults['L1-PA'] !== undefined ? (window.currentResults['L1-PA'] >= 0 ? '+' : '') + window.currentResults['L1-PA'].toFixed(1) + '°' : '-';
        let base_T4PA = window.currentResults['T4-PA'] !== undefined ? (window.currentResults['T4-PA'] >= 0 ? '+' : '') + window.currentResults['T4-PA'].toFixed(1) + '°' : '-';
        let base_C2Tilt = window.currentResults['C2 Tilt'] !== undefined ? (window.currentResults['C2 Tilt'] >= 0 ? '+' : '') + window.currentResults['C2 Tilt'].toFixed(1) + '°' : '-';

        let tbody = document.getElementById('theo-tbody');
        tbody.innerHTML = `
            <tr class="border-b border-gray-700/50 hover:bg-gray-800/50 transition-colors">
                <td class="py-2 pr-3 font-medium text-emerald-400">PI</td>
                <td class="py-2 pr-3">${base_PI}</td>
                <td class="py-2 font-bold text-emerald-400">${base_PI}</td>
            </tr>
            <tr class="border-b border-gray-700/50 hover:bg-gray-800/50 transition-colors">
                <td class="py-2 pr-3 font-medium text-white">L1-S1</td>
                <td class="py-2 pr-3 text-gray-300">${base_L1S1}</td>
                <td class="py-2 font-bold text-emerald-400">${ideal_L1S1.toFixed(1)}°</td>
            </tr>
            <tr class="border-b border-gray-700/50 hover:bg-gray-800/50 transition-colors">
                <td class="py-2 pr-3 font-medium text-white">L4-S1</td>
                <td class="py-2 pr-3 text-gray-300">${base_L4S1}</td>
                <td class="py-2 font-bold text-emerald-400">35° - 40°</td>
            </tr>
            <tr class="border-b border-gray-700/50 hover:bg-gray-800/50 transition-colors">
                <td class="py-2 pr-3 font-medium text-white">L1-PA</td>
                <td class="py-2 pr-3 text-gray-300">${base_L1PA}</td>
                <td class="py-2 font-bold text-emerald-400">${ideal_PA.toFixed(1)}°</td>
            </tr>
            <tr class="border-b border-gray-700/50 hover:bg-gray-800/50 transition-colors">
                <td class="py-2 pr-3 font-medium text-white">T4-PA</td>
                <td class="py-2 pr-3 text-gray-300">${base_T4PA}</td>
                <td class="py-2 font-bold text-emerald-400">${ideal_PA.toFixed(1)}°</td>
            </tr>
            <tr class="hover:bg-gray-800/50 transition-colors">
                <td class="py-2 pr-3 font-medium text-white">C2 Tilt</td>
                <td class="py-2 pr-3 text-gray-300">${base_C2Tilt}</td>
                <td class="py-2 font-bold text-emerald-400">+1° a -3°</td>
            </tr>
        `;

        document.getElementById('theoretical-table').classList.remove('hidden');
        updateStatus("Perfil Teórico calculado exitosamente.");
    }

    canvas.addEventListener('mousedown', function(e) {
        if(e.button !== 0) return;
        hideContextMenu();
        
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        dragObj = checkHit(mouseX, mouseY);
        if(dragObj && !activeTool) {
            canvas.style.cursor = 'grabbing';
            return;
        }

        if (activeTool) {
            const color = getNextColor();
            if (activeTool === 'sagittal') {
                currentMeasurement = {
                    id: Date.now(), type: 'sagittal', title: activeTitle, subType: activeSubType,
                    color: color, width: DEFAULT_LINE_WIDTH, fontSize: DEFAULT_FONT_SIZE,
                    points: [{x: mouseX, y: mouseY}],
                    textPos: {x: mouseX + 20, y: mouseY - 20}
                };
                measurements.push(currentMeasurement);
                deactivateTool();
                draw();
            }
            else if (activeTool === 'line' || activeTool === 'angle') {
                currentMeasurement = {
                    id: Date.now(), type: activeTool, title: activeTitle,
                    color: color, width: DEFAULT_LINE_WIDTH, fontSize: DEFAULT_FONT_SIZE,
                    points: [{x: mouseX, y: mouseY}, {x: mouseX, y: mouseY}],
                    textPos: {x: mouseX + 20, y: mouseY + 20}
                };
                measurements.push(currentMeasurement);
            } 
            else if (activeTool === 'cobb') {
                if(!currentMeasurement) {
                    currentMeasurement = {
                        id: Date.now(), type: 'cobb', title: activeTitle,
                        color: color, width: DEFAULT_LINE_WIDTH, fontSize: DEFAULT_FONT_SIZE,
                        points: [{x: mouseX, y: mouseY}, {x: mouseX, y: mouseY}],
                        textPos: null
                    };
                    measurements.push(currentMeasurement);
                } else {
                    currentMeasurement.points.push({x: mouseX, y: mouseY}, {x: mouseX, y: mouseY});
                }
            }
            else if (activeTool === 'circle') {
                currentMeasurement = {
                    id: Date.now(), type: 'circle', title: activeTitle,
                    color: color, width: DEFAULT_LINE_WIDTH, fontSize: DEFAULT_FONT_SIZE,
                    points: [{x: mouseX, y: mouseY}], radius: 0,
                    textPos: {x: mouseX + 20, y: mouseY + 20}
                };
                measurements.push(currentMeasurement);
            }
            else if (activeTool === 'pelvic') {
                if (pelvicStep === 1) {
                    currentMeasurement = {
                        id: Date.now(), type: 'pelvic', title: activeTitle,
                        color: color, width: DEFAULT_LINE_WIDTH, fontSize: DEFAULT_FONT_SIZE,
                        circles: [ {x: mouseX, y: mouseY, r: 0} ], 
                        line: [], textPos: null
                    };
                    measurements.push(currentMeasurement);
                } 
                else if (pelvicStep === 2) {
                    currentMeasurement.circles.push({x: mouseX, y: mouseY, r: 0});
                }
                else if (pelvicStep === 3) {
                    currentMeasurement.line = [{x: mouseX, y: mouseY}, {x: mouseX, y: mouseY}];
                }
            }
        }
        draw();
    });

    canvas.addEventListener('mousemove', function(e) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (dragObj && e.buttons === 1) {
            let item = dragObj.item;
            if (dragObj.type === 'text') {
                item.textPos.x = mouseX; item.textPos.y = mouseY;
            } else if (dragObj.type === 'point') {
                item.points[dragObj.index].x = mouseX;
                item.points[dragObj.index].y = mouseY;
            } else if (dragObj.type === 'circleCenter') {
                if(item.type === 'pelvic') {
                    item.circles[dragObj.index].x = mouseX;
                    item.circles[dragObj.index].y = mouseY;
                } else {
                    item.points[0].x = mouseX; item.points[0].y = mouseY;
                }
            } else if (dragObj.type === 'circleRadius') {
                if(item.type === 'pelvic') {
                    let cx = item.circles[dragObj.index].x, cy = item.circles[dragObj.index].y;
                    item.circles[dragObj.index].r = Math.hypot(mouseX - cx, mouseY - cy);
                } else {
                    item.radius = Math.hypot(mouseX - item.points[0].x, mouseY - item.points[0].y);
                }
            } else if (dragObj.type === 'pelvicLine') {
                item.line[dragObj.index].x = mouseX;
                item.line[dragObj.index].y = mouseY;
            } else if (dragObj.type === 'lineSegment') {
                let dx = mouseX - dragObj.lastX;
                let dy = mouseY - dragObj.lastY;
                if(item.points && item.points.length >= 2) {
                    item.points[dragObj.idx1].x += dx; item.points[dragObj.idx1].y += dy;
                    item.points[dragObj.idx2].x += dx; item.points[dragObj.idx2].y += dy;
                } else if (item.line && item.line.length === 2) {
                    item.line[dragObj.idx1].x += dx; item.line[dragObj.idx1].y += dy;
                    item.line[dragObj.idx2].x += dx; item.line[dragObj.idx2].y += dy;
                }
                dragObj.lastX = mouseX; dragObj.lastY = mouseY;
            }
            draw();
            
            if(!document.getElementById('theoretical-table').classList.contains('hidden')){
                showTheoreticalProfile();
            }
            return;
        }

        if (currentMeasurement && e.buttons === 1) {
            if (activeTool === 'line' || activeTool === 'angle') {
                currentMeasurement.points[1] = {x: mouseX, y: mouseY};
            }
            else if (activeTool === 'cobb') {
                if (currentMeasurement.points.length === 2) {
                    currentMeasurement.points[1] = {x: mouseX, y: mouseY};
                } else if (currentMeasurement.points.length === 4) {
                    currentMeasurement.points[3] = {x: mouseX, y: mouseY};
                }
            }
            else if (activeTool === 'circle') {
                currentMeasurement.radius = Math.hypot(mouseX - currentMeasurement.points[0].x, mouseY - currentMeasurement.points[0].y);
            }
            else if (activeTool === 'pelvic') {
                if (pelvicStep === 1) {
                    let c = currentMeasurement.circles[0];
                    c.r = Math.hypot(mouseX - c.x, mouseY - c.y);
                } else if (pelvicStep === 2) {
                    let c = currentMeasurement.circles[1];
                    c.r = Math.hypot(mouseX - c.x, mouseY - c.y);
                } else if (pelvicStep === 3) {
                    currentMeasurement.line[1] = {x: mouseX, y: mouseY};
                }
            }
            draw();
        } else {
            let hover = checkHit(mouseX, mouseY);
            if(hover) canvas.style.cursor = (hover.type==='text'||hover.type==='circleCenter'||hover.type==='lineSegment') ? 'move' : 'pointer';
            else canvas.style.cursor = activeTool ? 'crosshair' : 'default';
        }
    });

    canvas.addEventListener('mouseup', function(e) {
        if(dragObj) {
            dragObj = null;
            canvas.style.cursor = 'default';
            if(!document.getElementById('theoretical-table').classList.contains('hidden')){
                showTheoreticalProfile();
            }
            return;
        }

        if (currentMeasurement) {
            if (activeTool === 'line' || activeTool === 'circle' || activeTool === 'angle') {
                deactivateTool();
                draw(); 
            } 
            else if (activeTool === 'cobb') {
                if (currentMeasurement.points.length === 2) {
                    updateStatus(`Traza el Segundo Platillo`);
                } else if (currentMeasurement.points.length === 4) {
                    if(!currentMeasurement.textPos) {
                        currentMeasurement.textPos = {x: currentMeasurement.points[2].x + 20, y: currentMeasurement.points[2].y + 20};
                    }
                    deactivateTool();
                    draw(); 
                }
            }
            else if (activeTool === 'pelvic') {
                if(pelvicStep === 1) {
                    pelvicStep = 2;
                    updateStatus(`Traza la Segunda Cabeza Femoral`);
                } else if(pelvicStep === 2) {
                    pelvicStep = 3;
                    updateStatus(`Traza el Platillo de S1 (Línea)`);
                } else if(pelvicStep === 3) {
                    if(!currentMeasurement.textPos) {
                        currentMeasurement.textPos = {x: currentMeasurement.line[0].x + 40, y: currentMeasurement.line[0].y - 20};
                    }
                    deactivateTool();
                    draw(); 
                }
            }
        }
    });

    let selectedForContext = null;
    canvas.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        let hit = checkHit(mouseX, mouseY);
        if(hit) {
            selectedForContext = hit.item;
            contextMenu.style.display = 'block';
            contextMenu.style.left = e.clientX + 'px';
            contextMenu.style.top = e.clientY + 'px';
            
            document.getElementById('ctx-title').value = selectedForContext.title;
            document.getElementById('ctx-width').value = selectedForContext.width;
            document.getElementById('ctx-width-val').innerText = selectedForContext.width;
            document.getElementById('ctx-size').value = selectedForContext.fontSize;
            document.getElementById('ctx-size-val').innerText = selectedForContext.fontSize;
            document.getElementById('ctx-color').value = selectedForContext.color;
        } else {
            hideContextMenu();
        }
    });

    function hideContextMenu() {
        contextMenu.style.display = 'none';
        selectedForContext = null;
    }

    document.getElementById('ctx-title').addEventListener('input', e => { if(selectedForContext){ selectedForContext.title = e.target.value; draw(); }});
    document.getElementById('ctx-width').addEventListener('input', e => { if(selectedForContext){ selectedForContext.width = parseInt(e.target.value); document.getElementById('ctx-width-val').innerText = e.target.value; draw(); }});
    document.getElementById('ctx-size').addEventListener('input', e => { if(selectedForContext){ selectedForContext.fontSize = parseInt(e.target.value); document.getElementById('ctx-size-val').innerText = e.target.value; draw(); }});
    document.getElementById('ctx-color').addEventListener('input', e => { if(selectedForContext){ selectedForContext.color = e.target.value; draw(); }});
    document.getElementById('ctx-delete').addEventListener('click', () => {
        if(selectedForContext) {
            measurements = measurements.filter(m => m.id !== selectedForContext.id);
            hideContextMenu();
            draw();
            if(!document.getElementById('theoretical-table').classList.contains('hidden')){
                showTheoreticalProfile();
            }
        }
    });

    function draw() {
        ctx.clearRect(0,0, canvas.width, canvas.height);
        window.currentResults = {}; 

        if (bgImage) {
            ctx.drawImage(bgImage, imgX, imgY, bgImage.width * imgScale, bgImage.height * imgScale);
        }

        let val_L1PA = null;
        let val_T4PA = null;

        measurements.forEach(m => {
            ctx.strokeStyle = m.color;
            ctx.fillStyle = m.color;
            ctx.lineWidth = m.width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            if (m.type === 'line' || m.type === 'angle') {
                ctx.beginPath(); ctx.moveTo(m.points[0].x, m.points[0].y); ctx.lineTo(m.points[1].x, m.points[1].y); ctx.stroke();
                let dist = (Math.hypot(m.points[1].x - m.points[0].x, m.points[1].y - m.points[0].y) / imgScale).toFixed(1);
                let text = m.type === 'line' ? `${dist} mm` : 'Ángulo (WIP)';
                drawText(m.textPos.x, m.textPos.y, m.title, text, m.color, m.fontSize);
            }
            else if (m.type === 'circle') {
                ctx.beginPath(); ctx.arc(m.points[0].x, m.points[0].y, m.radius, 0, 2*Math.PI); ctx.stroke();
                drawText(m.textPos.x, m.textPos.y, m.title, `R: ${(m.radius/imgScale).toFixed(1)}mm`, m.color, m.fontSize);
            }
            else if (m.type === 'cobb') {
                if(m.points.length >= 2) {
                    ctx.beginPath(); ctx.moveTo(m.points[0].x, m.points[0].y); ctx.lineTo(m.points[1].x, m.points[1].y); ctx.stroke();
                }
                if(m.points.length === 4) {
                    ctx.beginPath(); ctx.moveTo(m.points[2].x, m.points[2].y); ctx.lineTo(m.points[3].x, m.points[3].y); ctx.stroke();
                    
                    let dx1 = m.points[1].x - m.points[0].x, dy1 = m.points[1].y - m.points[0].y;
                    let dx2 = m.points[3].x - m.points[2].x, dy2 = m.points[3].y - m.points[2].y;
                    let angle1 = Math.atan2(dy1, dx1);
                    let angle2 = Math.atan2(dy2, dx2);
                    let diff = Math.abs((angle1 - angle2) * 180 / Math.PI);
                    if (diff > 90) diff = 180 - diff;
                    
                    window.currentResults[m.title] = diff;
                    
                    if(m.textPos) drawText(m.textPos.x, m.textPos.y, m.title, `${diff.toFixed(1)}°`, m.color, m.fontSize);
                }
            }
            else if (m.type === 'pelvic') {
                m.circles.forEach(c => {
                    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 2*Math.PI); ctx.stroke();
                });
                
                if(m.line && m.line.length === 2) {
                    ctx.beginPath(); ctx.moveTo(m.line[0].x, m.line[0].y); ctx.lineTo(m.line[1].x, m.line[1].y); ctx.stroke();
                    
                    if(m.circles.length === 2 && m.textPos) {
                        let ha_x = (m.circles[0].x + m.circles[1].x) / 2;
                        let ha_y = (m.circles[0].y + m.circles[1].y) / 2;
                        let s1_mid_x = (m.line[0].x + m.line[1].x) / 2;
                        let s1_mid_y = (m.line[0].y + m.line[1].y) / 2;
                        
                        let dx = m.line[1].x - m.line[0].x;
                        let dy = m.line[1].y - m.line[0].y;
                        
                        let ss = Math.abs(Math.atan2(dy, dx) * 180 / Math.PI);
                        if(ss > 90) ss = 180 - ss;
                        
                        let pt_dx = s1_mid_x - ha_x;
                        let pt_dy = s1_mid_y - ha_y;
                        let pt = Math.abs((Math.atan2(pt_dy, pt_dx) * 180 / Math.PI) - 90);
                        if(pt > 90) pt = Math.abs(pt - 180);
                        
                        let pi = ss + pt;
                        window.currentResults['PI'] = pi;
                        
                        let resultText = `PI: ${pi.toFixed(1)}°\nPT: ${pt.toFixed(1)}°\nSS: ${ss.toFixed(1)}°`;
                        drawText(m.textPos.x, m.textPos.y, null, resultText, m.color, m.fontSize);
                    }
                }
            }
            else if (m.type === 'sagittal') {
                let pelvic = measurements.find(meas => meas.type === 'pelvic' && meas.circles.length === 2 && meas.line && meas.line.length === 2);
                if (pelvic) {
                    let ha_x = (pelvic.circles[0].x + pelvic.circles[1].x) / 2;
                    let ha_y = (pelvic.circles[0].y + pelvic.circles[1].y) / 2;
                    
                    ctx.beginPath();
                    ctx.arc(ha_x, ha_y, 2, 0, 2*Math.PI);
                    ctx.fillStyle = '#ef4444'; ctx.fill();
                    ctx.fillStyle = m.color;

                    ctx.beginPath(); ctx.moveTo(m.points[0].x, m.points[0].y); ctx.lineTo(ha_x, ha_y); ctx.stroke();

                    let angle = 0;
                    let signedAngle = 0;
                    let v1 = {x: m.points[0].x - ha_x, y: m.points[0].y - ha_y};
                    let mag1 = Math.hypot(v1.x, v1.y);

                    if (m.subType === 'pa') {
                        let s1_x = (pelvic.line[0].x + pelvic.line[1].x) / 2;
                        let s1_y = (pelvic.line[0].y + pelvic.line[1].y) / 2;
                        let v2 = {x: s1_x - ha_x, y: s1_y - ha_y};
                        let mag2 = Math.hypot(v2.x, v2.y);
                        
                        let dot = v1.x*v2.x + v1.y*v2.y;
                        angle = Math.acos(Math.max(-1, Math.min(1, dot / (mag1*mag2)))) * 180 / Math.PI;
                        
                        let cross = v2.x * v1.y - v2.y * v1.x;
                        let side = cross * gazeDirection;
                        signedAngle = side >= 0 ? angle : -angle;

                        window.currentResults[m.title] = signedAngle;
                        if (m.title === 'L1-PA') val_L1PA = signedAngle;
                        if (m.title === 'T4-PA') val_T4PA = signedAngle;
                    } 
                    else if (m.subType === 'tilt') {
                        let v2 = {x: 0, y: -1}; 
                        let dot = v1.x*v2.x + v1.y*v2.y;
                        let mag2 = 1;
                        angle = Math.acos(Math.max(-1, Math.min(1, dot / (mag1*mag2)))) * 180 / Math.PI;
                        
                        let side = v1.x * gazeDirection;
                        signedAngle = side >= 0 ? angle : -angle;

                        window.currentResults[m.title] = signedAngle;
                    }
                    
                    let prefix = signedAngle >= 0 ? '+' : '';
                    drawText(m.textPos.x, m.textPos.y, m.title, `${prefix}${signedAngle.toFixed(1)}°`, m.color, m.fontSize);

                } else {
                    drawText(m.textPos.x, m.textPos.y, m.title, "Requiere Pélvica", m.color, m.fontSize);
                }
            }
        });

        if(val_L1PA !== null && val_T4PA !== null) {
            let mismatch = val_T4PA - val_L1PA;
            let absMismatch = Math.abs(mismatch);
            let mColor = absMismatch <= 4 ? '#10b981' : '#f43f5e';
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 4;
            ctx.fillStyle = mColor;
            ctx.font = `bold 14px sans-serif`;
            ctx.fillText(`Mismatch (T4PA - L1PA): ${mismatch.toFixed(1)}°`, canvas.width - 260, 30);
            ctx.shadowBlur = 0;
        }
    }

    function drawText(x, y, title, text, color, fontSize) {
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetX = 1;
        ctx.shadowOffsetY = 1;

        let curY = y;
        ctx.fillStyle = color;

        if(title) {
            ctx.fillText(title, x, curY);
            curY += fontSize + 4;
        }

        let lines = text.split('\n');
        lines.forEach(l => {
            ctx.fillText(l, x, curY);
            curY += fontSize + 2;
        });

        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
    }

    function checkHit(x, y) {
        for (let i = measurements.length - 1; i >= 0; i--) {
            let m = measurements[i];
            
            if (m.textPos) {
                let h = (m.type === 'pelvic') ? m.fontSize * 4 : m.fontSize * 3;
                if (x >= m.textPos.x - 10 && x <= m.textPos.x + 80 && y >= m.textPos.y - 10 && y <= m.textPos.y + h) {
                    return { type: 'text', item: m };
                }
            }
            if (m.type === 'pelvic') {
                for(let c=0; c<m.circles.length; c++) {
                    let d = Math.hypot(x - m.circles[c].x, y - m.circles[c].y);
                    if (d < 15) return { type: 'circleCenter', item: m, index: c }; 
                    if (Math.abs(d - m.circles[c].r) < 8) return { type: 'circleRadius', item: m, index: c };
                }
                if (m.line && m.line.length === 2) {
                    let d1 = Math.hypot(x - m.line[0].x, y - m.line[0].y);
                    let d2 = Math.hypot(x - m.line[1].x, y - m.line[1].y);
                    if (d1 < 10) return { type: 'pelvicLine', item: m, index: 0 };
                    if (d2 < 10) return { type: 'pelvicLine', item: m, index: 1 };
                    
                    let lineLen = Math.hypot(m.line[1].x-m.line[0].x, m.line[1].y-m.line[0].y);
                    let dist = Math.abs((m.line[1].y-m.line[0].y)*x - (m.line[1].x-m.line[0].x)*y + m.line[1].x*m.line[0].y - m.line[1].y*m.line[0].x) / lineLen;
                    if(dist < 5 && x >= Math.min(m.line[0].x, m.line[1].x)-5 && x <= Math.max(m.line[0].x, m.line[1].x)+5) {
                        return { type: 'lineSegment', item: m, idx1: 0, idx2: 1, lastX: x, lastY: y };
                    }
                }
            }
            else if (m.type === 'sagittal') {
                let d = Math.hypot(x - m.points[0].x, y - m.points[0].y);
                if (d < 10) return { type: 'point', item: m, index: 0 };
            }
            else if (m.points) {
                for(let p=0; p<m.points.length; p++){
                    if (Math.hypot(x - m.points[p].x, y - m.points[p].y) < 10) {
                        return { type: 'point', item: m, index: p };
                    }
                }
                if(m.points.length >= 2) {
                    let lineLen = Math.hypot(m.points[1].x-m.points[0].x, m.points[1].y-m.points[0].y);
                    let dist = Math.abs((m.points[1].y-m.points[0].y)*x - (m.points[1].x-m.points[0].x)*y + m.points[1].x*m.points[0].y - m.points[1].y*m.points[0].x) / lineLen;
                    if(dist < 5 && x >= Math.min(m.points[0].x, m.points[1].x)-5 && x <= Math.max(m.points[0].x, m.points[1].x)+5) {
                        return { type: 'lineSegment', item: m, idx1: 0, idx2: 1, lastX: x, lastY: y };
                    }
                }
                if(m.points.length === 4) {
                    let lineLen = Math.hypot(m.points[3].x-m.points[2].x, m.points[3].y-m.points[2].y);
                    let dist = Math.abs((m.points[3].y-m.points[2].y)*x - (m.points[3].x-m.points[2].x)*y + m.points[3].x*m.points[2].y - m.points[3].y*m.points[2].x) / lineLen;
                    if(dist < 5 && x >= Math.min(m.points[2].x, m.points[3].x)-5 && x <= Math.max(m.points[2].x, m.points[3].x)+5) {
                        return { type: 'lineSegment', item: m, idx1: 2, idx2: 3, lastX: x, lastY: y };
                    }
                }
            }
        }
        return null;
    }
</script>
