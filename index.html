<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpinePlan Pro - Planificación Quirúrgica</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #toolbar { position: absolute; top: 0; left: 0; width: 100%; background: #1e1e1e; padding: 10px; display: flex; gap: 15px; align-items: center; z-index: 10; border-bottom: 1px solid #333; }
        .btn { background: #333; color: white; border: 1px solid #555; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn:hover { background: #555; }
        .btn.active { background: #007bff; border-color: #007bff; }
        #patient-data { display: flex; gap: 10px; margin-left: auto; margin-right: 20px; }
        .patient-input { background: #2a2a2a; border: 1px solid #444; color: white; padding: 5px 10px; border-radius: 4px; font-size: 12px; }
        #canvas-container { position: absolute; top: 50px; left: 0; width: 100%; height: calc(100vh - 50px); overflow: auto; display: flex; justify-content: center; align-items: center; background: #000; }
        canvas { cursor: crosshair; display: block; }
        #image-loader { display: none; }
        /* Tabla Flotante */
        #results-table { position: absolute; top: 70px; right: 20px; background: rgba(30,30,30,0.95); border: 1px solid #555; border-radius: 8px; padding: 15px; z-index: 20; display: none; cursor: move; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #results-table h3 { margin: 0 0 10px 0; font-size: 14px; color: #00a8ff; border-bottom: 1px solid #444; padding-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; color: white; font-size: 12px; }
        th, td { border: 1px solid #444; padding: 6px; text-align: center; }
        th { background: #2a2a2a; }
        .logrado-input { width: 40px; background: #111; border: 1px solid #555; color: #00ff00; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div id="toolbar">
    <input type="file" id="image-loader" accept="image/*">
    <button class="btn" onclick="document.getElementById('image-loader').click()">Cargar Radiografía</button>
    <button class="btn" id="btn-draw" onclick="setMode('draw')">✏️ Dibujar (1px)</button>
    <button class="btn" id="btn-edit" onclick="setMode('edit')">🖱️ Editar/Mover</button>
    <button class="btn" onclick="clearCanvas()" style="background: #a00;">🗑️ Limpiar Todo</button>
    <button class="btn" onclick="generateTable()" style="background: #006400;">📊 Generar Tabla Predictiva</button>
    
    <div id="patient-data">
        <input type="text" class="patient-input" placeholder="Nombre">
        <input type="text" class="patient-input" placeholder="Apellido">
        <input type="number" class="patient-input" placeholder="Edad" style="width: 50px;">
        <input type="text" class="patient-input" placeholder="Cédula">
        <input type="date" class="patient-input" title="Fecha de Nacimiento">
    </div>
</div>

<div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
</div>

<!-- Tabla Predictiva Flotante -->
<div id="results-table">
    <h3>Parámetros Bases Ideales y Logrados</h3>
    <table id="calc-table">
        <tr>
            <th>Parámetro</th>
            <th>Base (Medido)</th>
            <th>Ideal (Cálculo)</th>
            <th>Logrado (Post-qx)</th>
        </tr>
        <!-- Las filas se llenan con JS -->
    </table>
    <button class="btn" onclick="document.getElementById('results-table').style.display='none'" style="margin-top: 10px; width: 100%;">Cerrar Tabla</button>
</div>

<script>
    // Variables principales
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    let img = new Image();
    let shapes = [];
    let currentMode = 'draw';
    let isDrawing = false;
    let startX, startY;

    // Configuración visual estricta
    const config = {
        lineColor: '#00ff00',
        lineWidth: 1, // Mínimo absoluto
        fontSize: 10  // Mínimo absoluto para texto
    };

    // Cargar Imagen
    document.getElementById('image-loader').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                drawAll();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    });

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btn-draw').classList.toggle('active', mode === 'draw');
        document.getElementById('btn-edit').classList.toggle('active', mode === 'edit');
    }

    function drawAll() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (img.src) ctx.drawImage(img, 0, 0);
        
        shapes.forEach(shape => {
            ctx.beginPath();
            ctx.moveTo(shape.x1, shape.y1);
            ctx.lineTo(shape.x2, shape.y2);
            ctx.strokeStyle = config.lineColor;
            ctx.lineWidth = config.lineWidth;
            ctx.stroke();

            // Etiqueta de medida
            if(shape.measurement) {
                ctx.fillStyle = config.lineColor;
                ctx.font = `${config.fontSize}px Arial`;
                ctx.fillText(shape.measurement + "°", shape.x2 + 5, shape.y2 - 5);
            }
        });
    }

    // Dibujo básico (Simulado para mantener el código limpio en esta muestra)
    canvas.addEventListener('mousedown', (e) => {
        if (currentMode !== 'draw') return;
        isDrawing = true;
        const rect = canvas.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;
    });

    canvas.addEventListener('mouseup', (e) => {
        if (!isDrawing) return;
        isDrawing = false;
        const rect = canvas.getBoundingClientRect();
        const endX = e.clientX - rect.left;
        const endY = e.clientY - rect.top;
        
        // Simulación de cálculo de ángulo para la tabla
        let dist = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
        let mockAngle = Math.round(dist / 5); // Valor simulado para el MVP

        shapes.push({x1: startX, y1: startY, x2: endX, y2: endY, measurement: mockAngle});
        drawAll();
    });

    function clearCanvas() {
        shapes = [];
        document.getElementById('results-table').style.display = 'none';
        drawAll();
    }

    // Lógica de la Tabla Predictiva (Categoría 5)
    function generateTable() {
        const tableDiv = document.getElementById('results-table');
        const tableBody = document.getElementById('calc-table');
        
        // Limpiar filas anteriores (manteniendo el encabezado)
        while (tableBody.rows.length > 1) { tableBody.deleteRow(1); }

        // Mocks de extracción (En la app real extrae de la propiedad "type" de shapes)
        let pi_base = shapes.length > 0 ? shapes[0].measurement : 45; // Ejemplo: 45 o el que extraiga
        let l1s1_base = shapes.length > 1 ? shapes[1].measurement : 50;
        let l4s1_base = shapes.length > 2 ? shapes[2].measurement : 35;
        let l1pa_base = shapes.length > 3 ? shapes[3].measurement : 10;
        let l4pa_base = shapes.length > 4 ? shapes[4].measurement : 5;

        // Cálculos Ideales (Las fórmulas matemáticas que indicaste)
        let pi_ideal = pi_base;
        let l1s1_ideal = Math.round((pi_base * 0.6) + 30);
        let l4s1_ideal = "35° - 40°";
        let l1pa_ideal = Math.round((pi_base * 0.5) - 20);
        let l4pa_ideal = l1pa_ideal; // Misma fórmula

        const params = [
            { name: "Incidencia Pélvica (PI)", base: pi_base, ideal: pi_ideal },
            { name: "L1-S1", base: l1s1_base, ideal: l1s1_ideal },
            { name: "L4-S1", base: l4s1_base, ideal: l4s1_ideal },
            { name: "L1-PA", base: l1pa_base, ideal: l1pa_ideal },
            { name: "L4-PA", base: l4pa_base, ideal: l4pa_ideal }
        ];

        params.forEach(p => {
            let row = tableBody.insertRow();
            row.insertCell(0).innerText = p.name;
            row.insertCell(1).innerText = p.base + "°";
            row.insertCell(2).innerText = p.ideal + (typeof p.ideal === 'number' ? "°" : "");
            row.insertCell(3).innerHTML = `<input type="text" class="logrado-input" placeholder="°">`;
        });

        tableDiv.style.display = 'block';
    }

    // Hacer la tabla arrastrable
    const tableEl = document.getElementById('results-table');
    let isDraggingTable = false, offsetX, offsetY;
    tableEl.addEventListener('mousedown', function(e) {
        if(e.target.tagName.toLowerCase() === 'input' || e.target.tagName.toLowerCase() === 'button') return;
        isDraggingTable = true;
        offsetX = e.clientX - tableEl.getBoundingClientRect().left;
        offsetY = e.clientY - tableEl.getBoundingClientRect().top;
    });
    document.addEventListener('mousemove', function(e) {
        if (isDraggingTable) {
            tableEl.style.left = (e.clientX - offsetX) + 'px';
            tableEl.style.top = (e.clientY - offsetY) + 'px';
            tableEl.style.right = 'auto'; // Reset right
        }
    });
    document.addEventListener('mouseup', () => isDraggingTable = false);

    setMode('draw');
</script>
</body>
</html>
